[package]
name = "takusu-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "takusu-web"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["takusu-local/sqlite", "takusu-local-lib/sqlite"]

[dependencies]
takusu-local = { workspace = true, default-features = false }
takusu-local-lib = { workspace = true, default-features = false }
takusu-storage = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
rust-embed = "8"
mime_guess = "2"
