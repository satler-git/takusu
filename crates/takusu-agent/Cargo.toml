[package]
name = "takusu-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "takusu-agent"
path = "src/bin/agent.rs"
required-features = ["audio-device"]

[[bin]]
name = "generate-openapi"
path = "src/bin/generate-openapi.rs"
required-features = ["openapi"]

[features]
default = ["audio-device"]
audio-device = ["takusu-audio/sherpa", "takusu-audio/record"]
openapi = ["dep:aide"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("clap", "openapi"))'] }

[dependencies]
aide = { workspace = true, optional = true }
async-trait = { workspace = true }
indexmap = { version = "2" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
config = "0.15"
futures-util = "0.3"
inventory = { workspace = true }
jiff = { workspace = true }
jpholiday = "0.2.0"
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio-stream = "0.1"
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
takusu-audio = { path = "../takusu-audio", default-features = false }
takusu-client = { workspace = true }
takusu-habit = { workspace = true }
takusu-types = { workspace = true }
pulldown-cmark = { workspace = true }

[dev-dependencies]
axum = "0.8"
insta = { workspace = true, features = ["json"] }
