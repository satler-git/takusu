[package]
name = "takusu-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["record"]
record = ["dep:cpal"]
hush = ["dep:ort", "dep:realfft", "dep:num-complex", "dep:ndarray"]
sherpa = ["dep:sherpa-onnx"]
clap = ["dep:clap"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("clap"))'] }

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
takusu-types = { workspace = true }
reqwest = { version = "0.13", features = [
  "rustls",
  "blocking",
  "stream",
], default-features = false }
webpki-root-certs = "1"

cpal = { version = "0.18.1", optional = true }
tokio = { workspace = true }

tar = "0.4"
flate2 = "1"
bzip2 = "0.4"

bytes = "1"
futures-util = "0.3"
url = "2.5"

hound = "3.5"

lindera = { version = "=4.0.0", features = ["embed-ipadic"] }
regex = "1.12"
tracing = { workspace = true }

# ONNX pipeline for hush denoiser (Android-ready)
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }
realfft = { version = "3.5", optional = true }
num-complex = { version = "0.4", optional = true }
ndarray = { version = "0.17", optional = true }
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"], optional = true }
clap = { version = "4", optional = true, default-features = false, features = ["derive", "std"] }

[dev-dependencies]
tokio = { workspace = true }
