[package]
name = "takusu-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "takusu-local"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx", "takusu-local-lib/sqlite"]

[dependencies]
takusu-local-lib = { workspace = true, default-features = false }
takusu-types.workspace = true
takusu-search.workspace = true
takusu-contracts.workspace = true
axum = "0.8"
aide.workspace = true
schemars.workspace = true
tokio.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"], optional = true }
serde.workspace = true
serde_json.workspace = true
indexmap = "2"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing.workspace = true
sentry = { version = "0.48.4", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "rustls", "tracing", "ureq", "tower", "tower-axum-matched-path"] }
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
uuid.workspace = true
sha2.workspace = true
http = "1"
async-trait.workspace = true
jiff.workspace = true
takusu-local-lib = { workspace = true, features = ["sqlite"] }
rstest = "0.25"
tempfile = "3"
libc = "0.2"
