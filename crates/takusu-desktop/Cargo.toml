[package]
name = "takusu-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "takusu-desktop"
path = "src/main.rs"

[features]
# Pull in the shared agent audio runtime (VAD endpointing, voice session) for
# the daemon's local microphone capture (WI-12). Off by default so the tray-only
# daemon does not require cpal/sherpa.
audio-device = ["takusu-agent/audio-device", "dep:takusu-client", "dep:takusu-audio"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
futures-util = { version = "0.3" }
futures-channel = { version = "0.3" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true, features = ["json", "stream"] }
eventsource-stream = "0.2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
takusu-agent = { workspace = true, default-features = false }
takusu-audio = { workspace = true, optional = true }
takusu-contracts = { workspace = true }
takusu-types = { workspace = true }
takusu-client = { workspace = true, optional = true }
takusu-local = { workspace = true, default-features = false, features = ["sqlite"] }
takusu-local-lib = { workspace = true, default-features = false, features = ["sqlite"] }
axum = "0.8"
uuid = { workspace = true }
dirs = "6"
toml = "0.8"

# Linux desktop tray + notifications (WI-7). Both are tokio-native.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
gpui = { version = "0.2.2" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
