name: Staging release

on:
  push:
    branches:
      - 'staging-v*'

concurrency:
  group: staging-release-${{ github.ref_name }}
  cancel-in-progress: true

# Required secrets:
#   TAKUSU_RELEASE_TOKEN - PAT (or GitHub App installation token) used to push
#                          the release tag in the merge-and-tag job. It must not
#                          be the default GITHUB_TOKEN: events created by
#                          GITHUB_TOKEN do not trigger workflows, so the tag
#                          push would not start release.yaml. A PAT acts as a
#                          real user and triggers the Release workflow.

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.actor == 'satler-git'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse staging branch
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^staging-(v.+)$ ]]; then
            tag="${BASH_REMATCH[1]}"
            version="${tag#v}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "invalid branch name: $BRANCH" >&2
            exit 1
          fi

      - name: Verify Cargo.toml version
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          actual=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "Cargo.toml version ($actual) does not match branch version ($EXPECTED_VERSION)" >&2
            exit 1
          fi

      - name: Check tag does not exist
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi

  create-pr:
    needs: validate
    runs-on: ubuntu-latest
    if: github.actor == 'satler-git'
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find or create release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          number=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "release ${TAG}" \
              --body "staging release ${TAG}" \
              --no-maintainer-edit)
            number=$(basename "$url")
          fi
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

  build:
    needs: create-pr
    if: github.actor == 'satler-git'
    uses: ./.github/workflows/release.yaml
    with:
      deploy_worker: false
      apply_migrations: false
    secrets: inherit
    permissions:
      actions: write
      # The called release.yaml statically validates that callers grant at
      # least the maximum permission any of its jobs request. The prerelease
      # job requests `contents: write` even though it is skipped on branch
      # refs, so the caller must grant `contents: write` here too.
      contents: write

  merge-and-tag:
    needs: [validate, create-pr, build]
    runs-on: ubuntu-latest
    if: github.actor == 'satler-git'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # Push the tag with a PAT instead of the default GITHUB_TOKEN.
          # Events created by GITHUB_TOKEN never start a new workflow run, so a
          # tag pushed with it would not trigger release.yaml's
          # `on: push: tags: v*`. A PAT acts as a real user, so the tag push
          # below kicks off the Release workflow.
          token: ${{ secrets.TAKUSU_RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable auto-merge and wait for merge queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          # Merge queue is enabled on main. Auto-merge is enabled on the repo
          # so `gh pr merge` can set the PR to auto-merge when required checks
          # have not yet passed; once they pass, the merge queue merges the PR
          # asynchronously. No merge strategy is passed because the merge queue
          # creates the merge commit with its own message. --delete-branch
          # cannot be passed because the merge queue owns the branch until the
          # merge completes.
          gh pr merge "$PR_NUMBER"

          echo "waiting for PR ${PR_NUMBER} to be merged by the merge queue..."
          # The merge queue may need to re-run checks on the queued commit.
          # The build job already verified the release builds (45+ min), and
          # PR-triggered checks ran in parallel during the build. Poll for up
          # to 2 hours for the merge to complete.
          merged=0
          for i in $(seq 1 240); do
            pr_json=$(gh pr view "$PR_NUMBER" --json state,mergedAt,mergeCommit --jq '{state, mergedAt, mergeCommit: .mergeCommit.oid}')
            state=$(jq -r '.state' <<< "$pr_json")
            merged_at=$(jq -r '.mergedAt' <<< "$pr_json")
            merge_commit=$(jq -r '.mergeCommit // ""' <<< "$pr_json")

            # A merged PR can transiently show CLOSED while mergedAt is being
            # populated, so verify the merge commit is actually on origin/main
            # before deciding the PR has landed.
            if [ "$merged_at" != "null" ] && [ -n "$merge_commit" ]; then
              if git fetch --depth=50 origin main >/dev/null 2>&1 && \
                 git merge-base --is-ancestor "$merge_commit" origin/main 2>/dev/null; then
                echo "PR merged after ${i} polls"
                merged=1
                break
              fi
            fi

            # If the PR was closed without merging, fail immediately instead of
            # waiting the full polling window.
            if [ "$state" = "CLOSED" ] && [ "$merged_at" = "null" ]; then
              echo "PR ${PR_NUMBER} was closed without being merged" >&2
              exit 1
            fi

            sleep 30
          done

          if [ "$merged" -ne 1 ]; then
            echo "PR ${PR_NUMBER} was not merged within the polling window" >&2
            exit 1
          fi

          git push origin --delete "${{ github.ref_name }}" || true
          git fetch origin main
          git checkout -B main origin/main
          git tag "$TAG"
          git push origin "$TAG"

  cleanup:
    needs: [validate, create-pr, build, merge-and-tag]
    if: |
      github.actor == 'satler-git' &&
      failure() &&
      (needs.validate.result == 'failure' ||
       needs.create-pr.result == 'failure' ||
       needs.build.result == 'failure' ||
       needs.merge-and-tag.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Close PR and delete staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            state=$(gh pr view "$number" --json state --jq '.state')
            # Only close the PR if it is still open. If it has already been
            # merged or closed by the merge queue, leave its state alone and
            # just delete the staging branch.
            if [ "$state" = "OPEN" ]; then
              gh pr close "$number" || true
            fi
          fi
          git push origin --delete "$BRANCH" || true
